# 모의 포트폴리오 시작 현금 (통화별로 따로 굴린다, 환전 없음)
cash:
  KRW: 10000000
  USD: 10000
fee_rate: 0.0025          # 매수·매도 각각 거래대금 × 이 비율

# 안내 신호 기준값
signals:
  drawdown: 0.15          # 52주 고점 대비 -15% 이하
  ma: 200                 # 장기 이동평균 기간
  day_move: 0.04          # 하루 ±4% 이상
  vix_level: 25           # VIX 이 이상이면 경고
  vix_jump: 0.15          # VIX 하루 +15% 이상
  vol_mult: 1.5           # 돌파 타점: 거래량이 50일 평균의 이 배수 이상
  chase: 0.05             # 돌파 기준선 위 +5% 넘으면 추격 구간
  pivot_skip: 20          # 돌파 기준선 = 최근 20일을 뺀 52주 고점

