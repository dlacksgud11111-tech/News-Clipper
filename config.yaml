      - 비에이치아이
      - 한국전력
      - 한국수력원자력
      - 한수원

  - sector: 원전
    lang: en
    names:
      - Westinghouse
      - NuScale
      - Oklo
      - Fermi America
      - Centrus Energy
      - Holtec
      - X-energy
      - Rolls-Royce SMR

  - sector: 건설
    lang: ko
    names:
      - 현대건설
      - 삼성E&A
      - GS건설
      - 대우건설
      - DL이앤씨
      - HDC현대산업개발
      - 포스코이앤씨
      - SK에코플랜트
      - 금호건설
      - 아이에스동서
      - 자이에스앤디
      - 한미글로벌
      - 에스원
      - 한샘
      - LX하우시스
      - SNT에너지
      - 한텍
      - 지엔씨에너지
      - SGC에너지
      - SGC이테크건설

  - sector: 유틸리티
    lang: ko
    names:
      - 한국전력
      - 한국가스공사
      - 한국지역난방공사
      - 포스코인터내셔널
      - SK가스

  - sector: 전력기기
    lang: ko
    names:
      - 효성중공업
      - HD현대일렉트릭
      - LS일렉트릭
      - 일진전기
