# 수집 시간창. 오전 7시 실행 기준 25시간 = 전날 06시 ~ 당일 07시.
# (전날 국내 업무시간 전체 + 밤사이 해외 뉴스를 모두 덮습니다)
window_hours: 25

# 어떤 쿼리를 "산업·정책 쿼리"로 볼지 — 쿼리 name 에 이 문자열이 들어가면
# 거기서 나온 기사를 산업·정책 몫으로 셉니다.
# (제목에 종목명이 없다는 조건만으로는 재건축 시공사 선정 같은 개별 프로젝트
#  기사까지 산업 기사로 잡혀서, 쿼리 이름으로 구분하는 편이 정확합니다)
# 쿼리를 새로 추가할 때 이름에 "-정책-" 같은 표시를 넣으면 자동으로 포함됩니다.
industry_query_markers:
  - "-정책-"
  - "-업황-"
  - "-규제-"
  - "-산업-"
  - "-재무-"

# 산업·정책 기사에 주는 가산점.
# 정책·업황 기사는 커버리지 가산점(종목당 8점)을 받을 수 없어 구조적으로
# 점수가 낮습니다. 보정해주지 않으면 기업 뉴스에 항상 밀립니다.
industry_weight: 8

# 산업·정책 몫으로 앉히려면 최소 이 점수는 넘어야 합니다.
# 정책 쿼리는 검색어가 넓어서 공공기관 홍보·사진기사까지 끌고 옵니다.
# 이 문턱을 못 넘으면 그 자리는 일반 후보로 채워집니다.
industry_min_score: 14

# 후보 중 "산업·정책 기사"에 먼저 떼어줄 비율 (0~1).
#
# 커버리지 종목명이 제목에 있으면 가산점이 크기 때문에, 그냥 점수순으로 뽑으면
# 후보가 개별 기업 뉴스로만 채워집니다. 부동산 대책, 중대재해처벌법,
# 전력수급기본계획처럼 종목명은 없어도 섹터 전체에 영향을 주는 기사 자리를
# 먼저 확보합니다. 0.35면 24자리 중 8자리가 산업·정책 몫입니다.
# 0으로 두면 예전처럼 순수 점수순이 됩니다.
shortlist_industry_ratio: 0.35

# 숏리스트에서 국내 기사가 차지할 비율 (0~1).
# 해외 쿼리는 범위가 넓어 커버리지와 무관한 기사가 많이 걸립니다.
# 0.5로 두면 저품질 외신이 자리를 절반이나 먹으므로 0.65~0.7을 권합니다.
shortlist_ko_ratio: 0.67

# 최종 선별에 쓸 모델
model: claude-opus-5


# ------------------------------------------------------------
# 0. 커버리지 종목  ★ 이 파일에서 가장 중요한 부분입니다
#
#    여기 적힌 이름은 세 군데에 동시에 쓰입니다.
#      (1) 수집 — 종목명으로 검색 쿼리를 자동 생성합니다
#      (2) 스코어링 — 제목에 이름이 있으면 큰 가산점
#      (3) AI 선별 — "1순위: 커버리지 종목" 판단 기준으로 전달
#
#    종목을 넣고 빼는 것만으로 결과가 크게 바뀝니다.
#    검색어로 그대로 쓰이므로, 뉴스에 실제로 등장하는 표기를 적으세요.
#    (예: "LS"처럼 짧고 흔한 이름은 무관한 기사가 쏟아지니 "LS그룹"으로)
# ------------------------------------------------------------
coverage:
  - sector: 원전
    lang: ko
    names:
      - 두산에너빌리티
      - 한전기술
      - 한국전력기술   # 같은 회사인데 매체마다 표기가 다릅니다
