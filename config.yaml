# ============================================================
#  원전·건설·유틸리티 데일리 뉴스 클리핑 설정
#  이 파일만 고치면 소스/키워드/분량이 전부 바뀝니다.
#
#  대상 독자
#    A. 건설·원전 애널리스트
#    B. 유틸리티(변압기·한국전력·한국가스공사)·원전 애널리스트
# ============================================================

timezone: Asia/Seoul


# ------------------------------------------------------------
# 0-A. 발송 단위 — 섹터별로 각각 다른 메시지를 보냅니다
#
#   size        : 그 섹터에서 최종으로 고를 개수
#   pool        : 숏리스트에 확보할 후보 수 (size의 3배쯤이 적당)
#   chat_id_env : 이 섹터를 보낼 텔레그램 chat_id 환경변수 이름.
#                 비어 있거나 값이 없으면 TELEGRAM_CHAT_ID 로 보냅니다.
#                 섹터마다 채널을 따로 파고 싶으면 여기에 이름을 지정하고
#                 GitHub Secrets 에 그 이름으로 등록하세요.
# ------------------------------------------------------------
digests:
  - sector: 원전
    emoji: ⚛️
    title: 원전 Daily News
    size: 8
    pool: 24
    chat_id_env: TELEGRAM_CHAT_ID_NUCLEAR

  - sector: 건설
    emoji: 🏗️
    title: 건설 Daily News
    size: 8
    pool: 24
    chat_id_env: TELEGRAM_CHAT_ID_CONSTRUCTION

  - sector: 유틸리티
    emoji: ⚡
    title: 유틸리티 Daily News
    size: 8
    pool: 24
    chat_id_env: TELEGRAM_CHAT_ID_UTILITY

  - sector: 전력기기
    emoji: 🔌
    title: 전력기기 Daily News
    size: 8
    pool: 24
    chat_id_env: TELEGRAM_CHAT_ID_EQUIPMENT


# ------------------------------------------------------------
# 0-B. 섹터 판정 키워드
#   기사를 어느 섹터로 보낼지 정할 때 씁니다.
#   커버리지 종목명이 제목에 있으면 그 종목의 섹터가 우선합니다(가중치 5).
#   여기 단어는 보조 신호입니다(단어당 1점).
# ------------------------------------------------------------
