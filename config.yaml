# 수집 시간창. 오전 7시 실행 기준 25시간 = 전날 06시 ~ 당일 07시.
# (전날 국내 업무시간 전체 + 밤사이 해외 뉴스를 모두 덮습니다)
window_hours: 25

# 어떤 쿼리를 "산업·정책 쿼리"로 볼지 — 쿼리 name 에 이 문자열이 들어가면
# 거기서 나온 기사를 산업·정책 몫으로 셉니다.
# (제목에 종목명이 없다는 조건만으로는 재건축 시공사 선정 같은 개별 프로젝트
#  기사까지 산업 기사로 잡혀서, 쿼리 이름으로 구분하는 편이 정확합니다)
# 쿼리를 새로 추가할 때 이름에 "-정책-" 같은 표시를 넣으면 자동으로 포함됩니다.
industry_query_markers:
  - "-정책-"
  - "-업황-"
  - "-규제-"
  - "-산업-"
  - "-재무-"

# 커버리지 종목 가산점 (제목에 종목명이 있을 때, 최대 2개까지 누적).
#
# 8이던 것을 5로 낮췄습니다. 8이면 "한국가스공사, 가스텍2026 참가" 같은
# 홍보성 기사(22.4점)가 "한전 25조 선납 막혔다"(8.6점)를 이깁니다.
# 종목명이 들어 있다는 사실 자체는 기사의 중요도가 아닙니다.
coverage_weight: 5

# 산업·정책 기사에 주는 가산점.
# 정책·업황 기사는 커버리지 가산점을 받을 수 없어 구조적으로 점수가 낮습니다.
# 보정해주지 않으면 기업 뉴스에 항상 밀립니다. 커버리지(최대 10)보다
# 높게 잡아, 제도·요금·전기본 같은 기사가 홍보성 기업 기사를 이기게 합니다.
industry_weight: 12

# 산업·정책 몫으로 앉히려면 최소 이 점수는 넘어야 합니다.
# 정책 쿼리는 검색어가 넓어서 공공기관 홍보·사진기사까지 끌고 옵니다.
# 이 문턱을 못 넘으면 그 자리는 일반 후보로 채워집니다.
# 최종 10건으로 늘리면서 11로 낮췄습니다 (중요도 하한을 약간 완화).
industry_min_score: 11

# 제목만 나가는 형식이라, 제목을 읽어도 무슨 일인지 알 수 없으면 쓸 수 없습니다.
# 짧고 숫자도 없는 영문 제목(사설·칼럼·기획)에 주는 벌점입니다.
# 실제로 "Power to the people?" 이 원전 1위(58.5점)를 차지한 적이 있습니다.
weak_title_min_len: 32
weak_title_penalty: 12

# 한 기사를 여러 섹터에 보낼 조건.
# 으뜸 섹터 점수의 0.6배 이상이면서 6점을 넘긴 섹터에도 함께 보냅니다.
# 6점 = 제목에 커버리지 종목명이 있거나, 제목에 섹터 키워드가 둘 있는 무게.
# 웨스팅하우스 지분 인수처럼 원전·유틸리티 담당자가 모두 봐야 하는 뉴스를
# 한쪽만 받는 문제를 없앱니다.
sector_secondary_ratio: 0.6
sector_secondary_floor: 6.0

# 후보 중 "산업·정책 기사"에 먼저 떼어줄 비율 (0~1).
#
# 커버리지 종목명이 제목에 있으면 가산점이 크기 때문에, 그냥 점수순으로 뽑으면
# 후보가 개별 기업 뉴스로만 채워집니다. 부동산 대책, 중대재해처벌법,
# 전력수급기본계획처럼 종목명은 없어도 섹터 전체에 영향을 주는 기사 자리를
# 먼저 확보합니다. 0.35면 24자리 중 8자리가 산업·정책 몫입니다.
# 0으로 두면 예전처럼 순수 점수순이 됩니다.
shortlist_industry_ratio: 0.35

# 숏리스트에서 국내 기사가 차지할 비율 (0~1).
# 해외 쿼리는 범위가 넓어 커버리지와 무관한 기사가 많이 걸립니다.
# 0.5로 두면 저품질 외신이 자리를 절반이나 먹으므로 0.65~0.7을 권합니다.
shortlist_ko_ratio: 0.67

# 최종 선별에 쓸 모델
#   claude-sonnet-5  입력 $2 / 출력 $10 per 1M
#   claude-opus-5    입력 $5 / 출력 $25 per 1M  ← 현재 설정
#
# 고르는 눈이 결과물의 질을 거의 결정하므로 opus 로 올렸습니다.
# 하루 4번 호출, 후보 30건 기준이라 월 비용 차이는 크지 않습니다.
model: claude-opus-5


# ------------------------------------------------------------
# 0-C. 주제별 하한·상한
#
#   점수만으로는 조절되지 않는 두 가지를 여기서 강제합니다.
#     max … 이 주제가 후보를 다 먹지 못하게 상한을 둡니다.
#     min … 점수가 구조적으로 낮아 절대 안 올라오는 주제의 자리를 먼저 뗍니다.
#
#   후보(pool 30) 단계에서 적용되므로, 상한 3이면 최종 10건에도 3건을
#   넘을 수 없습니다. AI에게 "몇 건까지만 고르라"고 부탁하는 것보다 확실합니다.
# ------------------------------------------------------------
topic_rules:
  건설:
    # 재건축 수주전은 매일 쏟아집니다. 상한이 없을 때 실측하니 건설 상위
    # 12건 중 6건이 전부 재건축이었습니다. 3건으로 묶고 남는 자리를
    # 해외수주·정책·AI데이터센터·산업지표로 돌립니다.
    - name: 재건축수주전
      max: 3
      words:
        - 재건축
        - 재개발
        - 정비사업
        - 시공사 선정
        - 수주전
        - 조합
        - 단지
        - 평당
        - 분양

  유틸리티:
    # 미국 전력시장 제도는 종목명이 없어 점수가 낮습니다. 자리를 먼저
    # 떼어주지 않으면 절대 안 올라옵니다.
    - name: 미국전력시장제도
      min: 3
      max: 6
      floor: 8
      words:
        - ferc
        - caiso
        - pjm
        - ercot
        - miso
        - iso-ne
        - nerc
        - interconnection
        - capacity market
        - rate case
        - tax credit
        - 용량시장
        - 접속 대기
        - 전력시장 제도
# ------------------------------------------------------------
# 0. 커버리지 종목  ★ 이 파일에서 가장 중요한 부분입니다
#
#    여기 적힌 이름은 세 군데에 동시에 쓰입니다.
#      (1) 수집 — 종목명으로 검색 쿼리를 자동 생성합니다
#      (2) 스코어링 — 제목에 이름이 있으면 큰 가산점
#      (3) AI 선별 — "1순위: 커버리지 종목" 판단 기준으로 전달
#
#    종목을 넣고 빼는 것만으로 결과가 크게 바뀝니다.
#    검색어로 그대로 쓰이므로, 뉴스에 실제로 등장하는 표기를 적으세요.
#    (예: "LS"처럼 짧고 흔한 이름은 무관한 기사가 쏟아지니 "LS그룹"으로)
# ------------------------------------------------------------
