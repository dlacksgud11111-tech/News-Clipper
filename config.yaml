# ------------------------------------------------------------
# 1. Google News 검색 쿼리
#    - Google News RSS는 OR / site: / when:Nd 연산자를 지원합니다.
#    - lang: ko → 국내 매체 중심, en → 해외 매체 중심
#    - 쿼리 안의 {window} 는 실행 시 when:2d 같은 값으로 치환됩니다.
# ------------------------------------------------------------
queries:
  # ---- 국내 원전 ----
  - name: 원전-국내-정책산업
    lang: ko
    q: "(원전 OR 원자력 OR 핵발전) (정책 OR 계획 OR 예산 OR 법안 OR 규제 OR 승인) {window}"
  - name: 원전-국내-SMR
    lang: ko
    q: "(SMR OR 소형모듈원자로 OR 혁신형SMR OR i-SMR) {window}"
  - name: 원전-국내-기업
    lang: ko
    q: "(한수원 OR 한국수력원자력 OR 두산에너빌리티 OR 한전기술 OR 한전KPS OR 우리기술 OR 비에이치아이) {window}"
  - name: 원전-국내-수출프로젝트
    lang: ko
    q: "(원전 수출 OR 체코 원전 OR 폴란드 원전 OR 신한울 OR 새울 OR 원전 수주) {window}"
  - name: 원전-국내-연료폐기물
    lang: ko
    q: "(사용후핵연료 OR 고준위 방폐장 OR 원전 해체 OR 핵연료 OR 우라늄 농축) {window}"
  - name: 원전-규제-인허가
    lang: ko
    q: "(원자력안전위원회 OR 원안위 OR 운영허가 OR 계속운전 심사 OR 건설허가 OR 안전성 평가) {window}"
  - name: 원전-산업-생태계
    lang: ko
    q: "(원전 생태계 OR 원전 일감 OR 원전 기자재 OR 원전 협력업체 OR 주기기 OR 원전 인력) {window}"

  # ---- 국내 건설 ----
  - name: 건설-국내-수주실적
    lang: ko
    q: "(건설 수주 OR 해외건설 수주 OR 수주잔고 OR 플랜트 수주 OR 시공능력평가) {window}"
  - name: 건설-국내-대형사
    lang: ko
    q: "(현대건설 OR 삼성물산 건설 OR 대우건설 OR GS건설 OR DL이앤씨 OR 포스코이앤씨 OR HDC현대산업개발) {window}"
  - name: 건설-국내-정책시장
    lang: ko
    q: "(건설경기 OR 건설업계 OR 공사비 OR 분양 OR 재건축 OR 정비사업 OR 미분양) {window}"
  - name: 건설-국내-리스크
    lang: ko
    q: "(부동산PF OR PF 부실 OR 건설사 워크아웃 OR 중대재해 OR 공사 중단 OR 붕괴 사고) {window}"

  # ---- 건설 산업·정책 (종목명이 없어도 업황에 영향 주는 것들) ----
  - name: 건설-정책-부동산대책
    lang: ko
    q: "(부동산 대책 OR 주택공급 대책 OR 공급 확대 OR 청약 제도 OR 전월세 OR 임대차) {window}"
  - name: 건설-정책-정비사업제도
    lang: ko
    q: "(재건축 규제 OR 안전진단 OR 용적률 OR 분양가상한제 OR 재초환 OR 정비사업 인허가) {window}"
  - name: 건설-정책-안전규제
    lang: ko
    q: "(중대재해처벌법 OR 건설안전특별법 OR 산업안전보건법 OR 안전관리 의무 OR 처벌 수준) {window}"
  - name: 건설-업황-지표
    lang: ko
    q: "(건설투자 OR 건설수주 통계 OR 건설경기 전망 OR 착공 실적 OR 인허가 실적 OR 미분양 통계) {window}"
  - name: 건설-정책-SOC
    lang: ko
    q: "(SOC 예산 OR 국가철도망 OR GTX OR 공공공사 OR 공사비 산정 OR 표준시장단가) {window}"

  # ---- 국내 유틸리티 (전력·가스) ----
  - name: 유틸-한전
    lang: ko
    q: "(한국전력 OR 한전) (요금 OR 적자 OR 실적 OR 투자 OR 송배전 OR 전력수급 OR 구입비) {window}"
  - name: 유틸-가스공사
    lang: ko
    q: "(한국가스공사 OR 가스요금 OR LNG 도입 OR 천연가스 수급 OR 미수금) {window}"
  - name: 유틸-전력시장
    lang: ko
    q: "(전기요금 OR 전력수급 OR SMP OR 계통한계가격 OR 전력수요 OR 발전믹스 OR 용량요금) {window}"
  - name: 유틸-정책
    lang: ko
    q: "(전력수급기본계획 OR 에너지정책 OR 요금인상 OR 요금체계 OR 전력시장 제도) {window}"
  - name: 유틸-정책-탈탄소
    lang: ko
    q: "(탄소중립 OR 무탄소 전원 OR RE100 OR 재생에너지 목표 OR 온실가스 감축목표) {window}"
  - name: 유틸-재무-구조
    lang: ko
    q: "(한전 부채 OR 한전 적자 OR 전력구입비 OR 연료비 연동제 OR 총괄원가 OR 정산조정계수) {window}"

  # ---- 국내 전력기기 (변압기·전선·배전) ----
  - name: 전력기기-업황
    lang: ko
    q: "(변압기 OR 전력기기 OR 중전기 OR 배전반 OR 개폐기 OR 초고압 케이블) {window}"
  - name: 전력기기-기업
    lang: ko
    q: "(효성중공업 OR HD현대일렉트릭 OR LS일렉트릭 OR 일진전기 OR 대한전선 OR 가온전선 OR 제룡전기) {window}"
  - name: 전력기기-계통투자
    lang: ko
    q: "(송배전망 OR 전력망 확충 OR HVDC OR 변전소 OR 계통 보강) {window}"
  - name: 전력기기-AI전력
    lang: ko
    q: "(AI 데이터센터 전력 OR 전력수요 급증 OR 전력난 OR 데이터센터 전력공급) {window}"
  - name: 전력기기-정책-계통
    lang: ko
    q: "(전력망 특별법 OR 계통 접속 OR 송전망 건설 OR 주민 수용성 OR 지중화 OR 에너지고속도로) {window}"
  - name: 전력기기-업황-수출
    lang: ko
    q: "(변압기 수출 OR 전선 수출 OR 미국 전력망 투자 OR 변압기 가격 OR 구리 가격 OR 수주 호황) {window}"

  # ---- 해외 ----
  - name: nuclear-global-policy
    lang: en
    q: "(nuclear power OR nuclear plant) (policy OR approval OR licence OR license OR funding) {window}"
  - name: nuclear-global-smr
    lang: en
    q: "(SMR OR \"small modular reactor\" OR microreactor) {window}"
  - name: nuclear-global-deals
    lang: en
    q: "(nuclear) (contract OR order OR deal OR agreement OR construction start) {window}"
  - name: nuclear-global-players
    lang: en
    q: "(Westinghouse OR EDF OR Rosatom OR NuScale OR GE Vernova OR Holtec OR X-energy OR Kairos) {window}"
  - name: nuclear-global-fuel
    lang: en
    q: "(uranium OR enrichment OR nuclear fuel) (price OR supply OR contract OR sanction) {window}"
  - name: construction-global
    lang: en
    q: "(construction OR engineering) (contract award OR EPC OR megaproject OR backlog) {window}"
  - name: grid-equipment-global
    lang: en
    q: "(transformer OR switchgear OR \"grid equipment\" OR \"power equipment\") (order OR backlog OR shortage OR capacity OR lead time) {window}"
  - name: utility-global
    lang: en
    q: "(utility OR \"power grid\" OR \"electricity demand\") (tariff OR \"rate case\" OR capex OR \"data center\" OR investment) {window}"
  - name: lng-gas-global
    lang: en
    q: "(LNG OR \"natural gas\") (contract OR supply deal OR price OR terminal OR import) {window}"

  # ---- 2026-09-17 추가: 정답지 대조에서 드러난 공백 ----
  #
  # 3주치 정답지(miraepower / jsheo / HJS_YSK)와 제 수집 풀을 대조해
  # "풀에 아예 없던 주제"만 골라 넣었습니다. 이미 잡히던 주제
  # (대미투자 36건, 웨스팅하우스 41건, AIDC 158건)는 건드리지 않았습니다.

  # 미국 전력시장 제도 — jsheo 의 핵심 주제. 기존 풀에 3건뿐이었습니다.
  - name: us-grid-정책-rto
    lang: en
    q: "(FERC OR CAISO OR PJM OR ERCOT OR MISO OR \"ISO-NE\") (interconnection OR queue OR capacity market OR transmission OR rate) {window}"
  - name: us-grid-정책-interconnect
    lang: en
    q: "(\"interconnection queue\" OR \"capacity market\" OR \"transmission planning\" OR \"grid connection\") (approval OR auction OR reform OR backlog) {window}"
  - name: us-grid-정책-incentive
    lang: en
    q: "(\"tax credit\" OR ITC OR PTC OR AMPC OR IRA OR FEOC) (solar OR storage OR nuclear OR transfer OR price) {window}"
  - name: us-grid-산업-datacenter-ppa
    lang: en
    q: "(\"data center\" OR hyperscaler) (PPA OR \"power purchase\" OR interconnection OR nuclear OR gas turbine) {window}"

  # 해외 원전 프로젝트·EPC — 기존 풀에 4건뿐이었습니다.
  - name: nuclear-global-projects
    lang: en
    q: "(Rosatom OR Kazakhstan OR Vietnam OR Poland OR Czech OR Egypt) (nuclear OR reactor) (EPC OR contract OR construction OR agreement) {window}"
  - name: nuclear-global-restart
    lang: en
    q: "(nuclear) (restart OR \"license renewal\" OR \"life extension\" OR uprate OR \"DOE loan\") {window}"

  # 국내 전력 제도 — 용량시장·전기본·계통접속·주민수용성
  - name: 유틸-정책-전력시장제도
    lang: ko
    q: "(용량시장 OR 전력수급기본계획 OR 전기본 OR 집단에너지 OR 열병합 OR 재생에너지 입찰) {window}"
  - name: 전력기기-정책-계통접속
    lang: ko
    q: "(계통 접속 OR 접속 용량 OR 송전망 건설 OR 송전선로 OR 주민 수용성 OR 지중화 OR 변전소 부지) {window}"
  - name: 유틸-정책-직접구매
    lang: ko
    q: "(전기사업법 OR 전력 직접구매 OR PPA OR 전력구매계약) (개정 OR 발의 OR 허용 OR 도입) {window}"

  # 무역·관세 — 전력기기 실적에 직결되는데 풀에 13건뿐이었습니다.
  - name: 전력기기-규제-관세
    lang: ko
    q: "(반덤핑 OR 상계관세 OR 관세) (변압기 OR 전선 OR 케이블 OR 전력기기 OR 철강) {window}"
  - name: grid-규제-trade
    lang: en
    q: "(transformer OR cable OR \"grid equipment\") (tariff OR \"anti-dumping\" OR countervailing OR \"trade case\") {window}"

  # 자본거래·재무 — 커버리지 종목의 자금조달·지분거래. 풀에 5건뿐이었습니다.
  - name: 커버리지-재무-자본거래
    lang: ko
    q: "(효성중공업 OR HD현대일렉트릭 OR LS일렉트릭 OR 대한전선 OR LS전선 OR 두산에너빌리티 OR 현대건설 OR 대우건설 OR GS건설 OR 한국전력 OR 한국가스공사) (회사채 OR 공모채 OR 교환사채 OR 유상증자 OR 지분 매각 OR 신용등급 OR 자금 조달) {window}"

  # 건설 리스크 — 근로시간·공기 연장은 풀에 1건뿐이었습니다.
  - name: 건설-규제-근로시간
    lang: ko
    q: "(주 52시간 OR 근로시간 OR 공기 연장 OR 공사기간 OR 노무비) (건설 OR 원전 OR 현장 OR 플랜트) {window}"


# ------------------------------------------------------------
# 2. 특정 매체만 콕 집어서 보고 싶을 때
#    site: 연산자로 해당 매체 기사만 긁어옵니다.
#    (국내 건설·에너지 전문지는 자체 RSS를 막아둔 곳이 많아 이 방식이 안정적)
# ------------------------------------------------------------
site_queries:
  - name: 대한경제
    lang: ko
    site: dnews.co.kr
    q: "(원전 OR 건설 OR 수주 OR 플랜트)"
  - name: 전기신문
    lang: ko
    site: electimes.com
    q: "(원전 OR 전력 OR 에너지)"
  - name: 한국경제-산업
    lang: ko
    site: hankyung.com
    q: "(원전 OR 건설 수주 OR 플랜트)"
  - name: Reuters
    lang: en
    site: reuters.com
    q: "(nuclear OR construction contract)"


# ------------------------------------------------------------
# 3. 직접 RSS (전문지 — 구글뉴스가 잘 못 잡는 곳)
# ------------------------------------------------------------
feeds:
  - name: World Nuclear News
    lang: en
    url: https://www.world-nuclear-news.org/rss
  - name: Nuclear Engineering Intl
    lang: en
    url: https://www.neimagazine.com/feed/
  - name: 전기신문
    lang: ko
    url: https://www.electimes.com/rss/allArticle.xml


# ------------------------------------------------------------
# 4. 1차 스코어링 키워드 (20~30건으로 추릴 때 씀)
#    weight 가 높을수록 우선 선발됩니다.
# ------------------------------------------------------------
scoring:
  # 주제 적합성 — 이게 하나도 없으면 아예 탈락시킵니다
  topic:
    weight: 3
    words:
      - 원전
      - 원자력
      - SMR
      - 소형모듈원자로
      - 핵연료
      - 방폐장
      - 한수원
      - 건설
      - 시공
      - 플랜트
      - 토목
