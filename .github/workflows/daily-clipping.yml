name: 원전·건설 데일리 클리핑

# ─────────────────────────────────────────────────────────────
#  왜 "기다렸다가" 보내는가  (2026-09-15 개편)
#
#  GitHub의 schedule(cron)은 두 가지가 모두 보장되지 않습니다.
#
#    (1) 언제 도착할지  — 실측 지연 5분 ~ 105분. 날마다 다릅니다.
#    (2) 도착하기는 하는지 — 9/15에는 예약 13칸 중 단 1칸만 실행됐습니다.
#        (03:01~07:01 사이 12칸이 예약돼 있었는데 06:26 한 건만 실행)
#
#  예전 방식은 "06:45 전에 도착한 실행은 건너뛰고, 다음 예약이 하겠지"
#  였습니다. 그런데 그 '다음 예약'이 아예 오지 않는 날이 있습니다.
#  9/15가 그랬고, 그래서 그날은 한 통도 가지 않았습니다.
#
#  그래서 건너뛰지 않고 **붙잡아 둡니다**. 몇 시에 도착하든 그 실행이
#  잠들어 있다가 깨어나서 보냅니다. 하루에 예약이 단 한 번만 실행돼도
#  정시에 도착합니다.
#
#  대기는 두 번에 나눠서 합니다. 수집·선별에 1~2분이 걸리기 때문에
#  07:00에 깨워서 그때부터 일을 시키면 도착은 07:01~07:02가 됩니다.
#
#    1단계 (여기, sleep)        06:55까지 재운다
#    2단계 (clipper --send-at)  수집·선별을 끝내 놓고 07:00:00에 전송
#
#    04:12에 도착 → 06:55까지 대기 → 준비 → 07:00:00 발송
#    06:58에 도착 → 대기 없음    → 준비 → 07:00:00 발송 (준비가 늦으면 즉시)
#    07:20에 도착 → 대기 없음    → 준비 → 즉시 발송
#
#  기사 시간창은 준비를 시작한 시각(≈06:55) 기준입니다.
#  하루 한 번만 나가도록 날짜별 캐시(sent-YYYY-MM-DD)로 잠급니다.
# ─────────────────────────────────────────────────────────────
on:
  schedule:
    # UTC 17:07 ~ 22:47 = KST 02:07 ~ 07:47, 20분 간격 (18칸)
    #
    # GitHub이 이 중 몇 칸을 실제로 돌려줄지는 알 수 없습니다(9/15에는 13칸
    # 중 1칸). 그래서 "몇 칸이 실행되느냐"가 아니라 "한 칸이라도 07:00
    # 전에 도착하느냐"에 걸었습니다. 그물을 새벽까지 넓게 깔아두는 이유가
    # 이것입니다. 실측 지연이 100분이던 날에도 02~05시 칸이면 07:00 전에
    # 도착합니다.
    #
    # 공개 저장소라 Actions 사용 시간이 무제한이므로 대기가 길어져도
    # 요금 문제가 없습니다. (비공개로 되돌리면 월 2,000분 한도가 생기니
    # 그때는 21-22시(KST 06~07시)로 좁혀야 합니다.)
    - cron: "7,27,47 17-22 * * *"
  workflow_dispatch: # 수동 실행은 대기 없이 즉시 발송합니다.

concurrency:
  group: daily-clipping
  cancel-in-progress: false

env:
  SEND_AT: "07:00" # 목표 발송 시각 (KST). 이 시각에 초 단위로 도착합니다.
  # 수집·선별을 몇 분 앞당겨 시작할지. 실측 소요는 1~2분이라 5분이면
  # 넉넉합니다. 혹시 넘기더라도 준비가 끝나는 즉시 보냅니다.
  PREP_MIN: "5"
  # 대기 상한. 가장 이른 칸(KST 02:07)에서 07:00까지가 293분이고,
  # GitHub의 작업 1건 최대 실행 시간이 6시간(360분)이라 그 안에 듭니다.
  MAX_WAIT_MIN: "300"

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # MAX_WAIT_MIN + 수집·선별·전송 여유분

    steps:
      - name: 오늘 날짜 (KST)
        id: day
        run: echo "today=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_OUTPUT"

      - name: 오늘 이미 보냈는지 확인
        id: guard
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: sent-${{ steps.day.outputs.today }}

      - name: 이미 보냈으면 여기서 끝
        if: steps.guard.outputs.cache-hit == 'true'
        run: echo "오늘(${{ steps.day.outputs.today }}) 이미 발송했습니다. 종료합니다."

      - uses: actions/checkout@v4
        if: steps.guard.outputs.cache-hit != 'true'

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.cache-hit != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt
        if: steps.guard.outputs.cache-hit != 'true'

      # 예약 실행은 몇 시에 도착하든 '준비 시작 시각'까지 여기서 잠듭니다.
      # 수동 실행(workflow_dispatch)은 누른 즉시 보내야 하므로 건너뜁니다.
      - name: 준비 시작 시각까지 대기
        if: steps.guard.outputs.cache-hit != 'true' && github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Seoul date -d "today ${SEND_AT}" +%s)
          prep=$(( target - PREP_MIN * 60 ))
          wait=$(( prep - now ))
          echo "현재 $(TZ=Asia/Seoul date +'%m/%d %H:%M') KST"
          echo "준비 시작 $(TZ=Asia/Seoul date -d "@$prep" +'%H:%M') / 발송 ${SEND_AT} KST"
          if [ "$wait" -le 0 ]; then
            echo "이미 준비 시작 시각을 지났습니다 ($(( -wait / 60 ))분 경과). 바로 진행합니다."
            exit 0
          fi
          cap=$(( MAX_WAIT_MIN * 60 ))
          if [ "$wait" -gt "$cap" ]; then
            echo "대기 시간이 상한(${MAX_WAIT_MIN}분)을 넘어 상한까지만 기다립니다."
            wait=$cap
          fi
          echo "$(( wait / 60 ))분 $(( wait % 60 ))초 대기합니다."
          sleep "$wait"
          echo "깨어남: $(TZ=Asia/Seoul date +'%m/%d %H:%M:%S') KST"

      # 자는 동안 다른 실행이 발송을 마쳤을 수도 있으므로 한 번 더 확인합니다.
      - name: 대기 중에 누가 보냈는지 재확인
        id: guard2
        if: steps.guard.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .sent-marker
          key: sent-${{ steps.day.outputs.today }}

      - name: 뉴스 수집·선별·전송
        if: steps.guard.outputs.cache-hit != 'true' && steps.guard2.outputs.cache-hit != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # 예약 실행은 수집·선별을 먼저 끝내고 SEND_AT 정각에 전송합니다.
        # 수동 실행은 누른 즉시 보내야 하므로 --send-at 을 붙이지 않습니다.
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python clipper.py --marker .sent-marker --send-at "$SEND_AT"
          else
            python clipper.py --marker .sent-marker
          fi

      # 실제로 보냈을 때만 표시가 생깁니다. 전송이 전부 실패한 실행은 표시를
      # 남기지 않으므로, 뒤따르는 예약이 다시 시도하게 됩니다.
      - name: 발송했으면 오늘 표시 저장
        if: steps.guard.outputs.cache-hit != 'true' && steps.guard2.outputs.cache-hit != 'true' && hashFiles('.sent-marker') != ''
        uses: actions/cache/save@v4
        with:
          path: .sent-marker
          key: sent-${{ steps.day.outputs.today }}
