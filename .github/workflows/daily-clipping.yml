name: 원전·건설 데일리 클리핑

# 실행 시각은 여기서 정하지 않습니다.
# GitHub의 schedule(cron)은 정시성을 보장하지 않아 매번 100분쯤 늦었습니다.
# workflow_dispatch 는 호출 즉시 돌기 때문에, 외부 서비스(cron-job.org)가
# 매일 06:45에 GitHub API로 이 워크플로를 호출합니다.
# ※ schedule 을 다시 넣으면 하루 두 번 발송되니 주의하세요.
on:
  workflow_dispatch:

concurrency:
  group: daily-clipping
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 뉴스 수집·선별·전송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python clipper.py
